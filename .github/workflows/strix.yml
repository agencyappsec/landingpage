name: strix-security-scan

# Run this whenever someone opens or updates a pull request.
on: pull_request

# contents: read       -> check out the code
# pull-requests: write -> let report.js post a comment on the PR
permissions:
  contents: read
  pull-requests: write

jobs:
  security-scan:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to a full 40-character commit SHA rather than a
      # movable tag like @v4. A tag can be repointed by its owner at any time;
      # a commit SHA cannot. The comment records which release it is.
      - name: Check out the code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      # Strix is a Python program, so we need Python first.
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      # Version pinned so this run behaves the same next week.
      - name: Install Strix
        run: pip install "strix-agent==1.5.3"

      # continue-on-error: the scan's exit code does NOT decide the check.
      # report.js decides. See the last step.
      - name: Run the scan
        continue-on-error: true
        env:
          STRIX_LLM: ${{ secrets.STRIX_LLM }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY_TYPO }}
        run: |
          strix -n -t ./ \
            --scan-mode quick \
            --instruction-file .strix/instructions.md \
            --max-budget 2

      # if: always() — upload even if the scan crashed, so we can look at it.
      - name: Upload the findings
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: strix-runs
          path: strix_runs/
          if-no-files-found: warn

      # Read findings.sarif -> apply severity overrides -> drop accepted
      # findings -> post ONE comment on the PR -> exit non-zero only if
      # something at or above GATE_THRESHOLD survived.
      #
      # if: always()          -> report even when the scan crashed
      # NO continue-on-error  -> THIS step's exit code is the check result
      # GATE_THRESHOLD "off"  -> report everything, block nothing (start here)
      - name: Report findings and decide pass/fail
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_PR_NUMBER: ${{ github.event.pull_request.number }}
          GATE_THRESHOLD: "off"
        run: node .strix/report.js
