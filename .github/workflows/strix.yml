name: strix-security-scan

# Run this whenever someone opens or updates a pull request.
on: pull_request

# This job only needs to read the code.
permissions:
  contents: read

jobs:
  security-scan:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to a full 40-character commit SHA rather than a
      # movable tag like @v4. A tag can be repointed by its owner at any time;
      # a commit SHA cannot. The comment after each SHA records which release
      # it is, so a human can still read it. (CWE-829, found by the first scan.)
      - name: Check out the code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      # Strix is a Python program, so we need Python first.
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      # Version pinned so this run behaves the same next week.
      - name: Install Strix
        run: pip install "strix-agent==1.5.3"

      # continue-on-error: even if the scan finds problems, don't fail here.
      - name: Run the scan
        continue-on-error: true
        env:
          STRIX_LLM: ${{ secrets.STRIX_LLM }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
        run: |
          strix -n -t ./ \
            --scan-mode quick \
            --instruction-file .strix/instructions.md \
            --max-budget 2

      # if: always() — upload even if the scan crashed, so we can look at it.
      - name: Upload the findings
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: strix-runs
          path: strix_runs/
          if-no-files-found: warn
